{% extends 'base_biblioteca.html' %}

    {% block contenido %} 


        <table class="table">
        <thead>
            <tr>
            <th scope="col">Titulo</th>
            <th scope="col">Autor</th>
            <th scope="col">Categoria</th>
            <th scope="col">Disponivilidad</th>
            <th scope="col"></th>
            </tr>
        </thead>
        <tbody>

            {% for libro in libros %}
                

                <tr>
                <td>{{libro.titulo}}</td>
                <td>{{libro.autor}}</td>
                <td>{{libro.categoria}}</td>
                <td>
                    {% if libro.disponible == True %}
                        si
                    {% else %}
                        no
                    {% endif %}
                </td>
                <td><a href="{% url 'detalle_libro' libro.id %}">ver</a></td>
                </tr>
            {% endfor %}
        </tbody>
        </table>
        
    {% endblock contenido %}
